[project]
name = "aeropulse-x"
version = "1.0.0"
description = "SIH26054 mission-aware Digital Twin research prototype"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.29,<1",
    "pandas>=2.0,<3",
    "numpy>=1.24,<3",
    "scikit-learn==1.8.0",
    "joblib>=1.3,<2",
    "pydantic>=2.6,<3",
    "python-multipart>=0.0.9",
    "httpx>=0.27,<1"
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "torch>=2.0.0"
]

[tool.vercel]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
