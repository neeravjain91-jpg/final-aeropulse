name: Accuracy Benchmark

on:
  push:
    branches:
      - accuracy-remediation-phase2
  pull_request:
    branches:
      - main

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: pip install -r requirements-benchmark.txt
      - run: python scripts/benchmark_health_models.py --data-dir FINAL_DATASET
      - uses: actions/upload-artifact@v4
        with:
          name: health-model-benchmark
          path: reports/health_model_benchmark.json
