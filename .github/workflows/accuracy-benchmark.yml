name: Accuracy Benchmark

on:
  push:
    branches:
      - accuracy-remediation-phase2
  pull_request:
    branches:
      - main

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: pip install -r requirements-benchmark.txt pytest
      - name: Extract ACES dataset
        shell: bash
        run: |
          set -euo pipefail
          test -f FINAL_DATASET/ACES/aces_health.zip
          unzip -q -o FINAL_DATASET/ACES/aces_health.zip -d FINAL_DATASET/ACES
          test -f FINAL_DATASET/ACES/aces_health.csv
      - run: python scripts/benchmark_health_models.py --data-dir FINAL_DATASET
      - uses: actions/upload-artifact@v4
        with:
          name: health-model-benchmark
          path: reports/health_model_benchmark.json
